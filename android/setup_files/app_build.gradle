plugins {
     id 'com.android.application'
}

def buildWithCMake = project.hasProperty('BUILD_WITH_CMAKE');

android {
    namespace = "org.sthaid.ezApp"
    compileSdkVersion 35 // EZAPP - when tried setting this to 36, got the following build warning ...
                         // WARNING: We recommend using a newer Android Gradle plugin to use compileSdk = 36
                         // This Android Gradle plugin (8.7.3) was tested up to compileSdk = 35.
    ndkVersion = "28.2.13676358"
    defaultConfig {
        minSdkVersion 30     // EZAPP - API 29 needed for getifaddrs, and 30 needed for xxx jped decode
        targetSdkVersion 36  // EZAOO - the API level tested against
        versionCode 1
        versionName "1.0"
        externalNativeBuild {
            ndkBuild {
                arguments "APP_PLATFORM=android-30"  // EZAPP
                // arguments "V=1"  // EZAPP uncomment to enable verbose build output
                // abiFilters 'armeabi-v7a', 'arm64-v8a', 'x86', 'x86_64'
                abiFilters 'arm64-v8a'
            }
            cmake {
                arguments "-DANDROID_PLATFORM=android-30", "-DANDROID_STL=c++_static", "-DAPP_SUPPORT_FLEXIBLE_PAGE_SIZES=true"  // EZAPP
                // abiFilters 'armeabi-v7a', 'arm64-v8a', 'x86', 'x86_64'
                abiFilters 'arm64-v8a'
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
    applicationVariants.all { variant ->
        tasks["merge${variant.name.capitalize()}Assets"]
            .dependsOn("externalNativeBuild${variant.name.capitalize()}")
    }
    if (!project.hasProperty('EXCLUDE_NATIVE_LIBS')) {
        sourceSets.main {
            jniLibs.srcDir 'libs'
        }
        externalNativeBuild {
            if (buildWithCMake) {
                cmake {
                    path 'jni/CMakeLists.txt'
                }
            } else {
                ndkBuild {
                    path 'jni/Android.mk'
                }
            }
        }

    }
    lint {
        abortOnError = false
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    // EZAPP
    // - used by ezApp_utils.java
    // - https://play.google.com/sdks/details/com-google-android-gms-play-services-location?hl=en-US
    implementation 'com.google.android.gms:play-services-location:21.0.1' // Or the latest version
}
